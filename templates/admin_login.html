{% extends "base.html" %}

{% block content %}
<style>
.auth-wrap {
  min-height: 60vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 0;
}

.auth-card {
  background: #fff;
  border: 1px solid rgba(15,107,155,0.1);
  border-radius: 18px;
  box-shadow: 0 1px 3px rgba(13,31,45,0.05), 0 8px 32px rgba(13,31,45,0.1);
  width: 100%;
  max-width: 420px;
  overflow: hidden;
}

.auth-header {
  padding: 32px 32px 24px;
  border-bottom: 1px solid #f4f8fb;
}

.auth-icon {
  width: 46px;
  height: 46px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  margin-bottom: 16px;
}

.auth-header h2 {
  font-size: 20px;
  font-weight: 500;
  color: #0d1f2d;
  margin-bottom: 4px;
}

.auth-header p {
  font-size: 13.5px;
  color: #4d7a94;
  margin: 0;
}

.auth-body { padding: 28px 32px 32px; }

.form-group { margin-bottom: 18px; }

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #2a4a5e;
  margin-bottom: 6px;
}

.form-control {
  width: 100%;
  padding: 10px 14px;
  font-size: 14px;
  font-family: 'DM Sans', system-ui, sans-serif;
  border: 1px solid #dceaf3;
  border-radius: 8px;
  background: #f4f8fb;
  color: #0d1f2d;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  box-sizing: border-box;
}

.form-control:focus {
  outline: none;
  border-color: #0f6b9b;
  box-shadow: 0 0 0 3px rgba(15,107,155,0.1);
  background: #fff;
}

.submit-btn {
  width: 100%;
  padding: 11px;
  font-size: 14px;
  font-weight: 500;
  font-family: 'DM Sans', system-ui, sans-serif;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.15s;
  margin-top: 6px;
}

.submit-btn:active { transform: scale(0.98); }
.submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

.demo-note {
  background: #f4f8fb;
  border: 1px solid #dceaf3;
  border-radius: 8px;
  padding: 12px 14px;
  margin-top: 16px;
  font-size: 12.5px;
  color: #4d7a94;
}

.demo-note strong { color: #2a4a5e; }

.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }

.auth-card { animation: fadeUp 0.4s ease both; }
</style>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon" style="background:#eef2ff; color:#4f46e5;"><i class="fas fa-shield-alt"></i></div>
      <h2>Health Official Login</h2>
      <p>Secure access to the surveillance dashboard</p>
    </div>
    <div class="auth-body">
      <div id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
        </div>
        <button type="button" class="submit-btn" id="loginBtn" style="background:#4f46e5; color:#fff;" onclick="doLogin()">
          Login to Dashboard
        </button>
        <div class="demo-note">
          <strong>Demo credentials:</strong><br>
          Username: <strong>admin</strong> &nbsp;&middot;&nbsp; Password: <strong>admin123</strong>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
async function doLogin() {
  const btn = document.getElementById('loginBtn');
  btn.innerHTML = '<span class="spinner"></span> Logging in...';
  btn.disabled = true;

  try {
    const response = await axios.post('/api/admin/login', {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value
    });

    if (response.data.success) {
      localStorage.setItem('admin_logged_in', 'true');
      window.location.href = '/admin/dashboard';
    } else {
      alert('Login failed: Invalid credentials');
    }
  } catch (error) {
    alert('Error logging in. Please try again.');
  } finally {
    btn.innerHTML = 'Login to Dashboard';
    btn.disabled = false;
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
{% endblock %}
