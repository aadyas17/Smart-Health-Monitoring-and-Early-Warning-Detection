{% extends "base.html" %}

{% block content %}
<style>
.auth-wrap {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 0 40px;
}

.auth-card {
  background: #fff;
  border: 1px solid rgba(15,107,155,0.1);
  border-radius: 18px;
  box-shadow: 0 1px 3px rgba(13,31,45,0.05), 0 8px 32px rgba(13,31,45,0.1);
  width: 100%;
  max-width: 520px;
  overflow: hidden;
  animation: fadeUp 0.4s ease both;
}

.auth-header {
  padding: 32px 32px 24px;
  border-bottom: 1px solid #f4f8fb;
}

.auth-icon {
  width: 46px; height: 46px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  margin-bottom: 16px;
  background: #f0fdf4;
  color: #0d9488;
}

.auth-header h2 { font-size: 20px; font-weight: 500; color: #0d1f2d; margin-bottom: 4px; }
.auth-header p  { font-size: 13.5px; color: #4d7a94; margin: 0; }

.auth-body { padding: 28px 32px 32px; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

@media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }

.form-group { margin-bottom: 16px; }

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #2a4a5e;
  margin-bottom: 6px;
}

.form-control, .form-select {
  width: 100%;
  padding: 10px 14px;
  font-size: 14px;
  font-family: 'DM Sans', system-ui, sans-serif;
  border: 1px solid #dceaf3;
  border-radius: 8px;
  background: #f4f8fb;
  color: #0d1f2d;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  box-sizing: border-box;
}

.form-control:focus, .form-select:focus {
  outline: none;
  border-color: #0d9488;
  box-shadow: 0 0 0 3px rgba(13,148,136,0.1);
  background: #fff;
}

.submit-btn {
  width: 100%;
  padding: 11px;
  font-size: 14px;
  font-weight: 500;
  font-family: 'DM Sans', system-ui, sans-serif;
  background: #0d9488;
  color: #fff;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.15s;
  margin-top: 8px;
}

.submit-btn:hover { background: #0b7c71; }
.submit-btn:active { transform: scale(0.98); }
.submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

.auth-link { text-align: center; margin-top: 18px; font-size: 13px; color: #4d7a94; }
.auth-link a { color: #0d9488; text-decoration: none; font-weight: 500; }
.auth-link a:hover { text-decoration: underline; }

.section-sep {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #8fb8cc;
  margin: 20px 0 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-sep::before, .section-sep::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #e8f1f7;
}

.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
</style>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
      <h2>ASHA Worker Registration</h2>
      <p>Create your account to access the field portal</p>
    </div>
    <div class="auth-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" class="form-control" id="name" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="worker_id">Worker ID</label>
          <input type="text" class="form-control" id="worker_id" placeholder="Unique ID" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" class="form-control" id="phone" placeholder="+91 xxxxx xxxxx" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="area">Service Area</label>
        <select class="form-select" id="area" required>
          <option value="">Select your service area</option>
          <option value="North Zone">North Zone</option>
          <option value="South Zone">South Zone</option>
          <option value="East Zone">East Zone</option>
          <option value="West Zone">West Zone</option>
          <option value="Central Zone">Central Zone</option>
        </select>
      </div>

      <div class="section-sep">Security</div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Min. 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <input type="password" class="form-control" id="confirm_password" placeholder="Repeat password" required>
        </div>
      </div>

      <button type="button" class="submit-btn" id="registerBtn" onclick="doRegister()">
        Create Account
      </button>

      <div class="auth-link">
        Already have an account? <a href="/asha/login">Sign in here</a>
      </div>
    </div>
  </div>
</div>

<script>
async function doRegister() {
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirm_password').value;

  if (password !== confirmPassword) { alert('Passwords do not match.'); return; }
  if (password.length < 6) { alert('Password must be at least 6 characters.'); return; }

  const btn = document.getElementById('registerBtn');
  btn.innerHTML = '<span class="spinner"></span> Creating account...';
  btn.disabled = true;

  try {
    const response = await axios.post('/api/asha/register', {
      name: document.getElementById('name').value,
      worker_id: document.getElementById('worker_id').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      area: document.getElementById('area').value,
      password: password
    });

    if (response.data.success) {
      alert('Registration successful. Please login.');
      window.location.href = '/asha/login';
    } else {
      alert('Registration failed: ' + response.data.message);
    }
  } catch (error) {
    alert('Error registering. Please try again.');
  } finally {
    btn.innerHTML = 'Create Account';
    btn.disabled = false;
  }
}
</script>
{% endblock %}
